name: Monte Carlo Trading Simulation

on:
  workflow_dispatch:
    inputs:
      simulations:
        description: 'Number of simulations (1-100k, recommended max: 50k for GitHub Actions)'
        required: true
        default: '10000'
        type: number
      scenario_analysis:
        description: 'Include scenario analysis'
        required: false
        default: true
        type: boolean

jobs:
  simulate:
    name: Run Monte Carlo Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate simulation count
        run: |
          SIMS=${{ github.event.inputs.simulations }}
          SCENARIO="${{ github.event.inputs.scenario_analysis }}"

          if [ "$SIMS" -lt 1 ] || [ "$SIMS" -gt 100000 ]; then
            echo "❌ Error: Simulation count must be between 1 and 100,000"
            echo "   Provided: $SIMS"
            exit 1
          fi

          if [ "$SIMS" -lt 1000 ]; then
            echo "⚠️  Warning: Less than 1,000 simulations may produce unreliable results"
          fi

          # Different warnings based on scenario analysis setting
          if [ "$SCENARIO" = "true" ]; then
            TOTAL=$((SIMS * 4))
            if [ "$SIMS" -gt 50000 ]; then
              echo "⚠️  Warning: With scenario analysis enabled, $SIMS simulations = $TOTAL total simulations"
              echo "   This exceeds GitHub Actions recommended limit and may fail"
              echo "   Recommended: Use ≤50,000 with scenarios OR disable scenario analysis for larger runs"
            fi
            echo "ℹ️  Total simulations (main + 3 scenarios): $TOTAL"
          else
            if [ "$SIMS" -gt 50000 ] && [ "$SIMS" -le 100000 ]; then
              echo "ℹ️  Running $SIMS simulations without scenario analysis"
              echo "   This should complete successfully on GitHub Actions"
            fi
          fi

          echo "✓ Simulation count validated: $SIMS (Scenario analysis: $SCENARIO)"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monte Carlo Simulation
        run: |
          SIMS=${{ github.event.inputs.simulations }}
          SCENARIO="${{ github.event.inputs.scenario_analysis }}"

          echo "::group::Running Monte Carlo Simulation with $SIMS simulations"

          if [ "$SCENARIO" = "false" ]; then
            echo "Running without scenario analysis..."
            python monte_carlo_simulator.py -n $SIMS --no-scenario > simulation_output.txt 2>&1
          else
            echo "Running with scenario analysis..."
            python monte_carlo_simulator.py -n $SIMS > simulation_output.txt 2>&1
          fi

          echo "::endgroup::"

          echo "::notice::Simulation completed successfully with $SIMS simulations"

      - name: Display Summary
        run: |
          SIMS=${{ github.event.inputs.simulations }}
          SCENARIO="${{ github.event.inputs.scenario_analysis }}"

          echo "### 📊 Monte Carlo Simulation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Simulations: $SIMS" >> $GITHUB_STEP_SUMMARY
          echo "- Scenario Analysis: $SCENARIO" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          head -n 100 simulation_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download full results and charts from the artifacts below." >> $GITHUB_STEP_SUMMARY

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-results-${{ github.run_number }}
          path: |
            simulation_output.txt
            monte_carlo_results.png
          retention-days: 30

      - name: Check for output files
        run: |
          if [ -f "monte_carlo_results.png" ]; then
            echo "✓ Chart generated successfully"
            ls -lh monte_carlo_results.png
          else
            echo "⚠ Chart file not found"
          fi

          if [ -f "simulation_output.txt" ]; then
            echo "✓ Results captured successfully"
            wc -l simulation_output.txt
          else
            echo "⚠ Output file not found"
          fi
